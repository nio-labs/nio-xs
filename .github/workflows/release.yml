name: Release NioXS Binary & Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    name: Build Standalone Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Artifact names must match what bin/nioxs.js requests:
        #   non-Windows -> nioxs-{linux|darwin|termux}-{amd64|arm64}
        #   Windows     -> nioxs-windows-{amd64|arm64}.exe
        # os values mirror install.sh / install.ps1 detection.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nioxs-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: nioxs-linux-arm64
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact_name: nioxs-termux-arm64
            android: true
          - os: ubuntu-latest
            target: x86_64-linux-android
            artifact_name: nioxs-termux-amd64
            android: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nioxs-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nioxs-darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nioxs-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: nioxs-windows-arm64.exe

    steps:
      - name: Checkout NioXS (Open Source Gateway)
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # Pin to the same channel as rust-toolchain.toml so `targets:` installs
        # into the toolchain cargo actually uses.
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross toolchain
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Android NDK (Termux)
        if: matrix.android
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Release Binary with Embedded NioNano
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
          IS_ANDROID: ${{ matrix.android }}
        run: |
          set -euo pipefail
          # cargo uses the channel pinned in rust-toolchain.toml, so the target
          # must be added to that toolchain, not only to the setup action.
          rustup target add "$TARGET"
          # Rust env var name for a target, e.g. aarch64-linux-android ->
          # CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
          if [ -n "${LINKER:-}" ]; then
            VAR="CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER"
            export "$VAR=$LINKER"
          fi
          if [ "${IS_ANDROID:-}" = "true" ]; then
            API=21
            HOST_TAG=linux-x86_64
            NDK="${ANDROID_NDK_HOME:?ANDROID_NDK_HOME is not set}"
            TOOLBIN="$NDK/toolchains/llvm/prebuilt/$HOST_TAG/bin"
            case "$TARGET" in
              aarch64-linux-android) CC_BIN="aarch64-linux-android${API}-clang" ;;
              x86_64-linux-android)  CC_BIN="x86_64-linux-android${API}-clang" ;;
              *) echo "unsupported Android target: $TARGET" >&2; exit 1 ;;
            esac
            VAR="CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER"
            export "$VAR=$TOOLBIN/$CC_BIN"
            # cc-rs (used by ring and friends) also needs the C compiler and
            # archiver on CC/AR, plus the NDK bin dir on PATH.
            export CC="$TOOLBIN/$CC_BIN"
            export AR="$TOOLBIN/llvm-ar"
            export "PATH=$TOOLBIN:$PATH"
          fi
          cargo build --release --target "$TARGET" --bin nioxs
          mkdir -p dist
          if [ -f "target/$TARGET/release/nioxs.exe" ]; then
            BIN="nioxs.exe"
          else
            BIN="nioxs"
          fi
          cp "target/$TARGET/release/$BIN" "dist/${{ matrix.artifact_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish to npm
    needs: [build-binary]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Run the release workflow on a version tag (for example, v0.4.1)."
            exit 1
          fi

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node scripts/publish-npm.mjs
