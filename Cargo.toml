[workspace]
members = ["crates/contracts", "crates/provider", "crates/nano", "crates/storage", "crates/browser", "crates/artifacts"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "io-util", "time"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "=0.7.9"
futures-util = "=0.3.34"
tower = { version = "=0.5.3", features = ["util"] }

